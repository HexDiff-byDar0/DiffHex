name: deploy-neocities
on:
  push:
    branches: [main]
    paths:
      - 'app/indexclaude.html'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload web app to Neocities as index.html
        env:
          KEY_RAW: ${{ secrets.NEOCITIES_API_KEY }}
        run: |
          KEY=$(printf '%s' "$KEY_RAW" | tr -d '[:space:]')
          if [ -z "$KEY" ]; then
            echo "::warning::Brak sekretu NEOCITIES_API_KEY - pomijam deploy. Dodaj go w Settings > Secrets and variables > Actions."
            exit 0
          fi
          echo "Dlugosc klucza po oczyszczeniu: ${#KEY} (klucz API Neocities ma zwykle 32 znaki hex)"
          code=$(curl -sS -o resp.txt -w "%{http_code}" -H "Authorization: Bearer $KEY" \
            -F "index.html=@app/indexclaude.html" https://neocities.org/api/upload)
          echo "HTTP $code"; cat resp.txt; echo
          if [ "$code" != "200" ]; then
            echo "::error::Neocities odrzucil upload (HTTP $code). Sprawdz, czy sekret to API key z zakladki API (Manage Site Settings), a nie haslo."
            exit 1
          fi
          echo "OK - wgrano app/indexclaude.html -> Neocities (index.html)."
