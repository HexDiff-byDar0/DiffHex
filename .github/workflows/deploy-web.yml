name: deploy-neocities
on:
  push:
    branches: [main]
    paths:
      - 'app/indexclaude.html'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload web app to Neocities (index.html + indexclaude.html)
        env:
          KEY_RAW: ${{ secrets.NEOCITIES_API_KEY }}
        run: |
          KEY=$(printf '%s' "$KEY_RAW" | tr -d '[:space:]')
          if [ -z "$KEY" ]; then
            echo "::warning::Brak sekretu NEOCITIES_API_KEY - pomijam deploy."
            exit 0
          fi
          code=$(curl -sS -o resp.txt -w "%{http_code}" -H "Authorization: Bearer $KEY" \
            -F "index.html=@app/indexclaude.html" \
            -F "indexclaude.html=@app/indexclaude.html" \
            https://neocities.org/api/upload)
          echo "HTTP $code"; cat resp.txt; echo
          test "$code" = "200"
          echo "OK - wgrano index.html oraz indexclaude.html na Neocities."
