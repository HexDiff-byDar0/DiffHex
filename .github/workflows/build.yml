name: build-windows
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Wersja wydania (musi zgadzac sie z package.json), np. 2.36.0'
        required: true
        default: '2.36.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm install
      - name: Build Windows installer
        run: npx electron-builder --win --publish never
      - name: List output
        run: dir dist
        shell: cmd
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: DiffHex ${{ steps.tag.outputs.name }}
          files: dist/DiffHex-Setup-*.exe
          fail_on_unmatched_files: true
